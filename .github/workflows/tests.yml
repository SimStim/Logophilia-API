# Runs the API test suite on every push. tests/run.php emits GitHub Actions
# workflow commands (::group::, ::error::, ::notice::) and exits with the
# number of failed tests, so any non-zero exit fails this job automatically.
name: Basic API tests

# Run titles default to the commit message; pin it to something stable.
run-name: Basic API tests

on: push

jobs:
  tests:
    # Pinned instead of ubuntu-latest, whose migration notice otherwise shows
    # up as an annotation on every run (runner-images issue #14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Run test suite
        run: php tests/run.php
